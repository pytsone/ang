<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Animals lesson</p>
          <h1>English Adventure</h1>
        </div>
        <div class="stars-box" aria-live="polite">
          <span class="star-icon">⭐</span>
          <span id="starsCount">0</span>
        </div>
      </header>

      <main class="game-card">
        <div class="prompt-box">
          <p class="prompt-label">Listen and click</p>
          <h2 id="promptText">Find the animal</h2>
        </div>

        <button id="speakBtn" class="primary-btn" type="button">🔊 Hear it again</button>

        <div id="options" class="options" aria-live="polite"></div>

        <div id="result" class="result" aria-live="polite">Ready to play!</div>

        <button id="nextBtn" class="secondary-btn hidden" type="button">Next round</button>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
